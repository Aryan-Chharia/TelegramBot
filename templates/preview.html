<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{dataset_name}} - Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        
        .header .meta {
            font-size: 0.9rem;
            color: #888;
        }
        
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            background: #1a1a1a;
            border: 1px solid #333;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #333;
            white-space: nowrap;
        }
        
        th {
            background: #252525;
            color: #fff;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        .dtype {
            font-weight: 400;
            color: #666;
            font-size: 0.75rem;
            display: block;
        }
        
        tr:hover {
            background: #252525;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        td.number {
            font-family: 'SF Mono', Monaco, monospace;
            color: #7dd3fc;
        }
        
        td.text {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        td.null {
            color: #666;
            font-style: italic;
        }
        
        .footer {
            margin-top: 16px;
            padding: 12px;
            background: #1a1a1a;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #888;
        }
        
        .columns-info {
            margin-top: 20px;
            padding: 16px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #333;
        }
        
        .columns-info h2 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #fff;
        }
        
        .col-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .col-tag {
            background: #252525;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        
        .col-tag .name {
            color: #fff;
        }
        
        .col-tag .type {
            color: #666;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 {{dataset_name}}</h1>
        <div class="meta">{{row_count}} rows × {{col_count}} columns</div>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    {{table_headers}}
                </tr>
            </thead>
            <tbody>
                {{table_rows}}
            </tbody>
        </table>
    </div>
    
    <div class="footer">
        Showing first {{preview_count}} rows
    </div>
    
    <div class="columns-info">
        <h2>All Columns ({{col_count}})</h2>
        <div class="col-list">
            {{column_tags}}
        </div>
    </div>
</body>
</html>
